[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_XAI_API_KEY = "API_KEY_FROM_NETLIFY_ENV"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
